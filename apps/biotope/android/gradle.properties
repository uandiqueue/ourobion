# Keep the Android build inside the documented 16 GB Windows developer envelope.
# One Gradle daemon gets 1.5 GB heap + 768 MB metaspace + 256 MB code cache.
# This leaves host headroom; heavyweight jobs remain serialized per the README.
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=768m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=1
org.gradle.parallel=false
# Compile Kotlin inside the bounded Gradle process instead of starting another JVM.
kotlin.compiler.execution.strategy=in-process
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
