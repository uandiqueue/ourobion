# Semantic / data couplings — what static analysis CANNOT see.
#
# ourobion spans Dart (app), TypeScript (edge functions) and SQL (migrations). Many contracts between
# these are runtime/data shapes that share an implicit structure but are NOT linked by any import, so
# no structural graph (and none is auto-generated yet — see docs/graph/README.md) can catch them
# drifting. To stop that, EVERY edge names a `guard:` — a test file that makes the coupling executable.
# `node tools/context_sync.mjs --check` (pre-push hook + CI) fails if any `guard:` path is missing.
#
# `status: active`  -> the guard's assertions are implemented and enforce the coupling now.
# `status: planned` -> the guard file exists as a runnable, skipped placeholder; the real assertions
#                      land later. (The file must still exist so the existence check is honest.)
#
# Schema: a list under `couplings:`, each with id / from / to / why / guard / status (/ phase).

version: 1

couplings:
  - id: shared-types-ts-dart-parity
    from: shared/types/index.ts
    to: shared/types/index.dart
    why: >
      The shared contract types are duplicated across TypeScript (backend/edge functions) and Dart
      (app). Nothing imports across the language seam, so if one side adds/renames/retypes a field and
      the other does not, the app and backend silently disagree at runtime. Only a parity test holds
      the two declarations together. Governed by the 2-reviewer rule (docs/memory/0002).
    guard: apps/biotope/test/guards/shared_types_parity_test.dart
    status: active
    phase: P1S2

  - id: copy-guidelines-ts-dart-parity
    from: shared/constants/copy_guidelines.ts
    to: shared/constants/copy_guidelines.dart
    why: >
      The non-diagnostic copy rules (forbidden/allowed word lists, severity labels) exist in both TS
      and Dart so M5b/M6 can enforce them on both sides. If the two word lists diverge, a string the
      backend accepts could be rejected by the app or vice versa, weakening Product Principle #1
      (docs/memory/0003). No import links them — a parity test is the only guard.
    guard: apps/biotope/test/guards/copy_guidelines_parity_test.dart
    status: active
    phase: P1S2

  - id: daily-gut-row-to-schema
    from: shared/SHARED-CONTEXT.md DailyGutRow + shared/types
    to: supabase/migrations (daily_gut_rows columns) + the M2 Flutter model
    why: >
      DailyGutRow is the M2 source-of-truth shape (docs/memory/0001). Its fields must match the
      daily_gut_rows table columns the app writes and M5a/M6 read. A migration that renames a column,
      or a model field that drifts, breaks the write/read path with no compile-time error because the
      Supabase client speaks dynamic JSON. A schema/shape test is the only guard.
    guard: apps/biotope/test/guards/daily_gut_row_schema_test.dart
    status: active
    phase: P1S2

  # ─── Metrics registry (shared/metrics) — single source of truth for every metric ───────────────
  # The registry makes add/remove of a metric a localized, guard-protected change. See
  # docs/biotope/metrics-registry-design.md and shared/metrics/README.md.

  - id: metrics-registry-ts-dart-parity
    from: shared/metrics/registry.ts
    to: shared/metrics/registry.dart
    why: >
      The metrics registry is the single source of truth for every metric, duplicated across the
      TS (backend) and Dart (app) seam with no import linking them. If one side adds/removes/retypes
      a metric and the other does not, baselines, DQS and the contract silently disagree. Governed by
      the 2-reviewer rule (docs/memory/0002).
    guard: apps/biotope/test/guards/metrics_registry_parity_test.dart
    status: active
    phase: P2

  - id: metrics-registry-to-contract
    from: shared/metrics/registry.ts
    to: shared/types/index.ts + shared/types/index.dart (DailyGutRow / DailyPhysioRow)
    why: >
      Every active registry key for a table must be a field of that table's contract row (TS and
      Dart), and every non-system row field must be a registry metric. This is the guard that would
      have caught the DailyPhysioRow <-> wearable-key drift at build time.
    guard: apps/biotope/test/guards/metrics_registry_contract_test.dart
    status: active
    phase: P2

  - id: metrics-registry-to-schema
    from: shared/metrics/registry.ts
    to: supabase/migrations (daily_gut_rows / wearable_daily columns + the continuity primitives)
    why: >
      For the legacy wide tables, registry keys per table must equal the metric columns of that
      table's migration — a migration that renames or adds a metric column without a matching
      registry entry (or vice versa) breaks the write/read path with no compile-time error because
      the Supabase client speaks dynamic JSON. For the continuity primitives (events / state_bands /
      signals / derived_metrics) metrics share tall/narrow rows keyed by metric_key, so the guard
      instead asserts each primitive's migration exists with its core columns, and that every table
      an active registry metric declares is covered by one of the two semantics.
    guard: apps/biotope/test/guards/metrics_registry_schema_test.dart
    status: active
    phase: P2

  - id: metrics-registry-to-baselines
    from: shared/metrics/registry.ts
    to: supabase/functions/compute-baselines/index.ts
    why: >
      compute-baselines must derive its metric key list from the registry, never from hardcoded key
      literals, and (since S3 baseline v2) read day-series through the S2 metric_daily_values view
      rather than the wide tables. The original wearable-key drift was exactly a hardcoded
      WEARABLE_METRIC_KEYS array drifting from the contract; this guard makes that impossible.
    guard: apps/biotope/test/guards/metrics_registry_baselines_test.dart
    status: active
    phase: P2

  - id: metrics-registry-to-daily-values-view
    from: shared/metrics/registry.ts
    to: supabase/migrations (metric_daily_values view, generated by tools/metric-view)
    why: >
      The S2 metric_daily_values view migration is GENERATED SQL — one unpivot branch per active
      numeric/ordinal registry metric plus the signals daily-grain branch. A registry change (add /
      remove / re-home a metric) silently starves the whole serve path (S3/S5/S7 read only this view)
      unless the committed migration is regenerated, so the guard re-renders the SQL from the
      registry and fails on any byte drift (same check as `gen_metric_view.mjs --check`).
    guard: tools/metric-view/tests/view_migration_drift.test.ts
    status: active
    phase: P2

  - id: metrics-registry-to-signals
    from: shared/metrics/registry.ts
    to: supabase/functions/evaluate-signals/index.ts
    why: >
      The evaluate-signals edge function (S4 3-state signal + S5 n=1 evaluator) must derive its
      metric key list AND its per-metric deadband (signal.deadbandK, ADR-0002) from the registry —
      never from hardcoded key literals — and read day-series only through the S2
      metric_daily_values view. Same drift class the baselines guard exists for: a registry change
      must reach the signal path with no manual key-list edit.
    guard: apps/biotope/test/guards/metrics_registry_signals_test.dart
    status: active
    phase: P2

  - id: adr-0002-s4-signal-stats
    from: docs/shared/decisions/0002-anomaly-definition.md (S4 robust anomaly definition)
    to: supabase/functions/evaluate-signals/stats.ts (+ config.ts C3 constants)
    why: >
      The S4 statistics are a prose contract (ADR-0002) implemented as pure TS with no compiler
      linking doc to code: median/MAD (sigma-hat = MAD/0.6745), artifact rejection strictly
      |M| > 3.5 (boundary kept), deadband neutral iff |x - median| <= deadbandK*sigma-hat
      (boundary neutral), baselineMinDays guard, MAD-degeneracy fallback. Only executable vectors
      keep the implementation honest to the decided thresholds and boundary semantics.
    guard: tools/engine-stats/tests/s4_signal.test.ts
    status: active
    phase: P2

  - id: adr-0002-s5-evaluator-stats
    from: docs/shared/decisions/0002-anomaly-definition.md (S5 pairwise evaluator definition)
    to: supabase/functions/evaluate-signals/stats.ts (+ config.ts C4 constants)
    why: >
      Same doc-to-code seam for the S5 half: Spearman with average-rank ties, Pyper–Peterman
      modified-Chelton N_eff (bias-corrected autocorrelations, ~N/5 truncation, canonical 2/N
      rendering), Benjamini–Hochberg step-up q-values, evaluatePair null-alignment and the
      flat-vs-no-data failure modes, and the deterministic fixed-window sign-stability gate
      (never unseeded resampling — Invariant 1). Held by hand-computed and published vectors.
    guard: tools/engine-stats/tests/s5_pairwise.test.ts
    status: active
    phase: P2

  - id: metrics-registry-to-engine
    from: shared/metrics/registry.ts
    to: supabase/functions/generate-insights/index.ts
    why: >
      Every rule's metricKey in the insight engine must resolve to an active registry metric, so a
      rule can never read a metric that was never defined or has been removed.
    guard: apps/biotope/test/guards/metrics_registry_engine_test.dart
    status: active
    phase: P2

  # ─── Rules as data (shared/rules + data/rules + the rules table) — rules-engine-design §B1–B5 ──
  # Blueprints are TRUTH; the rules table is a loader-owned projection (docs/memory/0007). The
  # node guards live in tools/rules/tests/ (run via `npm --prefix tools/rules test`).

  - id: rules-blueprint-to-schema
    from: data/rules/{single,cross}/**.json
    to: shared/rules/rule.schema.ts (+ shared/metrics/registry.ts keys)
    why: >
      The blueprint JSONs are hand-authored data with no compiler: only the zod contract makes a
      malformed rule, an unknown/removed metric key, or a wrong on-disk path fail before the loader
      projects it into the rules table. This is the database-free B5 blueprint gate (memory 0007).
    guard: tools/rules/tests/rule_blueprint.test.ts
    status: active
    phase: P2

  - id: rules-templates-to-copy-guidelines
    from: data/rules/**.json template.title / template.body
    to: shared/constants/copy_guidelines.ts (validateCopyString)
    why: >
      Rule templates are user-facing copy authored as data, so the non-diagnostic gate (memory 0003)
      must bind them the same way it binds hardcoded strings. Enforced three times — zod schema +
      loader hard-fail + this guard — but only the guard runs in CI without a database.
    guard: tools/rules/tests/rule_blueprint.test.ts
    status: active
    phase: P2

  - id: rules-schema-to-rules-table
    from: shared/rules (flattened blueprint row, tools/rules/lib/blueprints.mjs flattenRule)
    to: supabase/migrations (rules table columns + CHECK sets)
    why: >
      The loader speaks dynamic SQL into the rules table, so a renamed column or a CHECK set that
      drifts from the contract enums (condition types, category, severity, scope, status,
      provenance tier) breaks the load path with no compile-time error. This test parses the
      migration DDL and holds it column-for-column to the flattened contract.
    guard: tools/rules/tests/rules_table_schema.test.ts
    status: active
    phase: P2

  - id: rules-table-to-insight-cards-parity
    from: supabase/migrations (rules category/severity CHECKs)
    to: supabase/migrations (insight_cards category/severity CHECKs)
    why: >
      The engine copies a rule's category/severity straight onto the fired card, so the two tables'
      CHECK sets must stay character-identical or the loader could accept a rule whose card
      insight_cards rejects at insert time. No import links two migrations — only a parity test.
    guard: apps/biotope/test/guards/rules_table_contract_test.dart
    status: active
    phase: P2

  - id: rules-blueprint-to-engine-coverage
    from: data/rules/**.json condition types
    to: supabase/functions/generate-insights (evaluators, engine refactor step C)
    why: >
      Every condition type a blueprint uses must have an evaluator branch in the engine, or a rule
      ships that can never fire. The evaluator surface (evaluators.ts) lands with the engine
      refactor; until then the guard is a runnable, skipped placeholder.
    guard: tools/rules/tests/engine_condition_coverage.test.ts
    status: planned
    phase: P2

  # ─── The brain (shared/brain + R2 edge artifacts + the S6 serving tables) — §S6/§A11 ───────────
  # Edge artifacts are TRUTH (R2 JSONL, validated by shared/brain); the S6 tables are a
  # loader-owned projection. The node guards live in tools/edge-loader/tests/ (run via
  # `npm --prefix tools/edge-loader test`).

  - id: brain-edge-to-schema
    from: shared/brain (contract enums + tools/edge-loader/lib/artifacts.mjs row shapes)
    to: supabase/migrations (relationship_claims / edge_verifications columns + CHECK sets + verified_edges view)
    why: >
      The A11 loader speaks dynamic SQL into the S6 tables, so a renamed column, a CHECK set that
      drifts from the shared/brain enums (relation kinds, verdicts, verification statuses, serving
      bands), or a view that stops selecting the newest active verification breaks the serve path
      with no compile-time error. This test parses the migration DDL and holds it column-for-column
      and enum-for-enum to the contract the loader writes.
    guard: tools/edge-loader/tests/edge_table_schema.test.ts
    status: active
    phase: P2

  - id: brain-endpoint-to-registry
    from: shared/brain edge endpoints (subject / object metric keys in edge artifacts + fixtures)
    to: shared/metrics/registry.ts (active metric keys)
    why: >
      Edge endpoints are canonical registry keys with no import linking the artifacts to the
      registry (relationships.ts header invariant). An edge naming a removed or never-defined
      metric would serve insights about a metric the product cannot read. The loader hard-fails on
      non-active endpoints (parseClaims); this guard proves both the enforcement path and that the
      shipped fixture artifacts resolve.
    guard: tools/edge-loader/tests/edge_endpoints_registry.test.ts
    status: active
    phase: P2

  - id: metrics-registry-to-dqs
    from: shared/metrics/registry.ts (countsTowardDailyCompleteness weights)
    to: apps/biotope/lib/modules/m2_self_report/impl/normaliser.dart (kDailyCoreDqsWeights)
    why: >
      The M2 normaliser computes the Data Quality Score from the daily-core (T1) metric weights. Those
      weights are owned by the registry (the metrics with countsTowardDailyCompleteness: true), but the
      normaliser can't import shared/metrics (cross-language parity mirror), so without a guard the two
      silently drift and the DQS stops reflecting the registry.
    guard: apps/biotope/test/guards/metrics_registry_dqs_test.dart
    status: active
    phase: P2
