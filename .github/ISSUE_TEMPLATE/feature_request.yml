name: Feature Request
description: New feature or behaviour change
labels: ["feat"]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module does this belong to?
      options:
        - M1 — Core & Compliance
        - M2 — Self-Report
        - M3 — Wearables
        - M4 — Environmental context
        - M5a — Baselines
        - M5b — Insight Engine
        - M6 — Engagement
        - M7 — Community
        - nao — Brain web app
        - brain — Knowledge graph / ingestion pipeline
        - CI / Workflow
        - Shared types
        - New module
    validations:
      required: true

  - type: dropdown
    id: phase
    attributes:
      label: Phase scope
      description: Is this in scope for the current phase?
      options:
        - Phase 2 — Track A (biotope app)
        - Phase 2 — Track B (brain / nao)
        - Phase 3+ (post stress-test gate)
        - Backlog / later
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What do you want to build?
      description: Describe the feature and why it is needed.
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: How will we know it is done?
      placeholder: |
        - [ ]
        - [ ]
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Pre-checks
      options:
        - label: "This is within the current phase scope (see `docs/development/phase-2-plan.md`)"
        - label: "No shared types need to change — or the team has discussed it"
