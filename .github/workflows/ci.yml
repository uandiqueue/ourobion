name: CI

# The non-bypassable backstop: mirrors the local pre-push gate (skippable with --no-verify) and adds
# the checks that can only run in CI. dev-phase2-run4 is intentionally unprotected by owner decision,
# so Run 4 treats completed CI on the exact current landing SHA as evidence rather than GitHub-enforced
# protection. Core jobs:
#   - context     : context integrity + single generated human graph-view invariant
#   - flutter     : flutter analyze + flutter test (with the public env file built from secrets)
#   - typescript  : tsc --noEmit over the shared/ contracts
#   - node-tools  : matrix over the tools/* node packages — npm ci + typecheck + test, plus the
#                   DB-free drift guards (rules --check, metric-view --check). All suites are
#                   offline-first: no Docker, no DB, no network, no secrets.
#   - nao         : apps/nao typecheck + node:test suites (no build — needs CF bindings)
#   - deno-check       : frozen Deno check over the four edge-function handler entrypoints (audit A24) —
#                        the only compile pass the Deno.serve shells get before deploy.
#   - migrations-apply : applies supabase/migrations/*.sql in filename order against a vanilla
#                        postgres:17 service (audit A24). A shadow apply: it complements — does
#                        NOT replace — the local `npx supabase db reset` on the real supabase
#                        image; its job is catching SQL syntax/ordering/constraint-name breaks
#                        in CI, where no supabase stack exists.
#   - model-training-core      : model-training/'s stdlib `unittest` suite + CLI config-validation/
#                                offline-smoke commands. NO `pip install` step at all (D2,
#                                docs/temp/model-training/code-build-decisions.md) — proves the
#                                core substrate really needs zero installed packages.
#   - model-training-lint-type : ruff format/lint + mypy over model-training/. Installs only the
#                                `dev` extra (ruff/mypy) — never the heavy `ml` extra.
on:
  push:
    branches: [main, dev-phase2, dev-phase2-run3, dev-phase2-run4]
  pull_request:
    branches: [main, dev-phase2, dev-phase2-run3, dev-phase2-run4]

jobs:
  context:
    name: Context — sessions / memory / decisions / index / couplings
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so context_sync's session-coverage check can diff origin/main..HEAD.
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Context check
        run: node tools/context_sync.mjs --check

      - name: Human graph view — renderer tests and single-view invariant
        run: |
          node --test tools/graph-view/tests/*.test.mjs
          node tools/graph-view/generate_graph_view.mjs --check

  # Run 4 O24/O31-O34. These three gates all fail closed: a missing base, a malformed
  # config/matrix, or absent bundle evidence is a release block, never a warning.
  run4-release:
    name: Run 4 release evidence
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev-phase2-run4') || (github.event_name == 'pull_request' && github.base_ref == 'dev-phase2-run4') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.8.1
      - name: Install release-gate dependencies
        run: npm ci
      - name: Assert exact landing SHA and U0 unit base
        env:
          RUN4_UNIT_BASE_SHA: c558c04f1b661a59c8987c96770768eeea46e0cc
          RUN4_MAX_CHANGED_PATHS: 115
          RUN4_MAX_ADDED_LINES: 8500
        run: |
          git fetch --no-tags origin "$RUN4_UNIT_BASE_SHA"
          node tools/run4_release_gate.mjs provenance --event-path "$GITHUB_EVENT_PATH" --github-sha "$GITHUB_SHA"
          node tools/run4_release_gate.mjs landing --base "$RUN4_UNIT_BASE_SHA" --head "$GITHUB_SHA" --max-paths "$RUN4_MAX_CHANGED_PATHS" --max-added "$RUN4_MAX_ADDED_LINES"
      - name: Verify parsed function and workflow invariants
        run: |
          node --test tools/run4_release_gate.test.mjs
          node tools/run4_release_gate.mjs config
      - name: Recompute frozen graphs and verify local-only runtime attestation
        run: node tools/run4_release_gate.mjs attest --deno deno --supabase-cli ./node_modules/.bin/supabase --graph-dir "$RUNNER_TEMP/run4-graphs"

  flutter:
    name: Flutter — Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Create public env file
        working-directory: apps/biotope
        run: |
          printf "SUPABASE_URL=%s\n" "${{ secrets.SUPABASE_URL }}" > .env.public
          printf "SUPABASE_ANON_KEY=%s\n" "${{ secrets.SUPABASE_ANON_KEY }}" >> .env.public

      - name: Install dependencies
        working-directory: apps/biotope
        run: flutter pub get

      - name: Analyze
        working-directory: apps/biotope
        run: flutter analyze

      - name: Test
        working-directory: apps/biotope
        run: flutter test

  typescript:
    name: TypeScript — Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        working-directory: shared
        run: npm ci

      - name: Type check shared types
        working-directory: shared
        run: npx tsc --noEmit

  node-tools:
    name: Node tools — ${{ matrix.package }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - tools/brain-ingest
          - tools/llm-router
          - tools/rules
          - tools/edge-loader
          - tools/engine-stats
          - tools/metric-view
        include:
          # DB-free drift guards (`npm run check` = --check/--dry-run: validate + render, no DB).
          # edge-loader's --check is NOT here: it needs an edges/ artifact source (--from-dir
          # mirror or R2 credentials), which CI does not have — its zod validation is covered by
          # the package's own tests instead.
          - package: tools/rules
            drift_check: true
          - package: tools/metric-view
            drift_check: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # brain-ingest and llm-router declare engines.node >=26; the rest accept >=20.
          node-version: '26'
          cache: npm
          cache-dependency-path: |
            ${{ matrix.package }}/package-lock.json
            shared/package-lock.json

      # The tool suites import the shared/ TS contracts directly (via tsx), which resolve
      # zod & co. from shared/node_modules — install those first.
      - name: Install shared contract dependencies
        working-directory: shared
        run: npm ci

      - name: Install dependencies
        working-directory: ${{ matrix.package }}
        run: npm ci

      - name: Typecheck
        working-directory: ${{ matrix.package }}
        run: npm run typecheck

      - name: Test
        working-directory: ${{ matrix.package }}
        run: npm test

      - name: Drift check
        if: matrix.drift_check
        working-directory: ${{ matrix.package }}
        run: npm run check

  # ─── nao (apps/nao, Next.js on OpenNext/Cloudflare) — typecheck + node:test suites (run-2 U6,
  # the first nao code unit adds the job). Offline-first like node-tools: fixtures/stubs only, no
  # Docker, no DB, no secrets. Deliberately NO `next build` step: the OpenNext build needs
  # Cloudflare bindings (wrangler.jsonc R2/D1) that CI does not have.
  nao:
    name: nao — typecheck & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          # apps/nao declares engines.node >=26 (its node:test suites import .ts directly).
          node-version: '26'
          cache: npm
          cache-dependency-path: apps/nao/package-lock.json

      - name: Install dependencies
        working-directory: apps/nao
        run: npm ci

      - name: Typecheck
        working-directory: apps/nao
        run: npm run typecheck

      - name: Test
        working-directory: apps/nao
        run: npm test

  # ─── Audit A24: the four Deno handler shells (Deno.serve + jsr: imports) are imported by
  # nothing the node jobs compile — this is their only type check before deploy. Runs from each
  # function's directory so its deno.json (the same file config.toml points at as import_map) is
  # the discovered config and the walk never reaches the repo-root package.json. Every handler
  # uses the shared frozen supabase/deno.lock generated with Deno 2.8.1.
  deno-check:
    name: Deno — ${{ matrix.function }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        function:
          - compute-baselines
          - evaluate-signals
          - generate-insights
          - run-pipeline
    steps:
      - uses: actions/checkout@v4

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          # The lockfile is generated and checked with this exact runtime.
          deno-version: v2.8.1

      - name: Type check handler
        working-directory: supabase/functions/${{ matrix.function }}
        run: deno check --config deno.json --lock ../../deno.lock --frozen index.ts

  # Stable CI evidence target (the Run 4 branch is intentionally unprotected by owner decision):
  # explicit needs plus always() makes a missing/skipped dependency visible and red.
  run4-gate:
    name: Run 4 Gate
    if: ${{ always() && ((github.event_name == 'push' && github.ref == 'refs/heads/dev-phase2-run4') || (github.event_name == 'pull_request' && github.base_ref == 'dev-phase2-run4')) }}
    needs: [context, run4-release, flutter, typescript, node-tools, nao, deno-check, migrations-apply, model-training-core, model-training-lint-type, arch-boundaries, secret-scan]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install release-gate dependencies
        run: npm ci

      - name: Fail unless every required dependency succeeded
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: node tools/run4_release_gate.mjs aggregate

  # ─── Audit A24: shadow-apply every migration, in filename order, on vanilla postgres:17
  # (major version = supabase/config.toml `major_version`). Complements — does NOT replace —
  # the local `npx supabase db reset` (real supabase image, real pg_cron/pg_net/auth): this job
  # exists to catch SQL syntax errors, ordering breaks, and constraint-name assumptions in CI.
  # Vanilla postgres lacks supabase's primitives, so two bootstrap steps run first:
  #   1. stub pg_cron/pg_net extension definitions are docker-cp'd into the service container
  #      (`create extension` needs control files on the server filesystem — SQL cannot fake it);
  #   2. ci/migrations-bootstrap.sql creates the roles/auth schema/extensions schema the
  #      migrations reference. Both are documented in-file.
  migrations-apply:
    name: Migrations — shadow apply (postgres:17)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGDATABASE: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4

      - name: Install pg_cron/pg_net stubs into the service container
        run: |
          docker cp ci/pg-extension-stubs/. ${{ job.services.postgres.id }}:/usr/share/postgresql/17/extension/

      - name: Bootstrap supabase-shaped primitives
        run: psql -v ON_ERROR_STOP=1 -q -f ci/migrations-bootstrap.sql

      - name: Apply migrations in filename order
        run: |
          set -eu
          for f in $(ls supabase/migrations/*.sql | sort); do
            echo "== $f"
            psql -v ON_ERROR_STOP=1 -q -f "$f"
          done

  # ─── model-training/ core substrate (build unit MT0). CI pins Python 3.10 to match the
  # documented GMI runtime (CUDA 12.4 / Python 3.10.12; D3, code-build-decisions.md). This job
  # installs NOTHING beyond the interpreter itself — D2's whole point is that
  # ourobion_model_lab's core substrate depends on the stdlib only, so the offline `unittest`
  # suite, config validation, and offline smoke below must pass with zero installed packages.
  # Never downloads a dataset or pretrained weight.
  model-training-core:
    name: model-training — core (stdlib only, zero installs)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-training
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Unit tests (stdlib unittest, zero installs)
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

      - name: Config validation (dry-run resolves the fixture job without executing it)
        env:
          PYTHONPATH: src
        run: >
          python -m ourobion_model_lab.cli dry-run --model self-check
          --config tests/fixtures/example_config.json

      - name: Offline smoke (tiny local fixture only — no network, no real data)
        env:
          PYTHONPATH: src
        run: >
          python -m ourobion_model_lab.cli smoke --model self-check
          --config tests/fixtures/example_config.json

  # ─── model-training/ lint/format/type-check (build unit MT0). Separate from
  # model-training-core on purpose: this is the one job allowed to `pip install` anything, and it
  # only ever installs the `dev` extra (ruff + mypy, exact-pinned in constraints.txt) — never the
  # heavy `ml` extra.
  model-training-lint-type:
    name: model-training — lint / format / type-check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: model-training
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install the dev extra only (ruff + mypy)
        run: pip install -c constraints.txt -e ".[dev]"

      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

  # ─── Run 4 O35 / O36 (unit R4-U1) ──────────────────────────────────────────────────────────
  # Required by Run 4 Gate. tools/run4_release_gate.mjs freezes both jobs' step sets and complete
  # parsed-job hashes, so removal, command drift, action-pin drift, or aggregate omission fails CI.
  #
  # Invariants, all load-bearing:
  #   * no continue-on-error, no `|| true`, no `set +e`, no per-step `if:`, no always()
  #   * every multi-command run: block opens with `set -euo pipefail` — GitHub's default
  #     shell is `bash -e {0}` (no pipefail, no -u), so an unset path variable would
  #     otherwise sail past silently
  #   * third-party actions pinned by immutable commit SHA; the scanner pinned by version
  #     AND by SHA256 of the exact linux-x64 artifact (tools/secret-scan/pins.json)
  #   * no `npm ci`: both guards are Node-stdlib-only, so node_modules never exists and the
  #     `gitleaks dir .` scan sees only tracked files
  #   * the scanner's execution is PROVED by a canary scan, never inferred from exit 0
  #   * `--redact=100` uses the equals form on purpose: `--redact` is declared `uint[=100]`,
  #     so `--redact 100` parses as flag-plus-positional and aborts with
  #     "accepts at most 1 arg(s)". Measured against gitleaks 8.30.1.
  arch-boundaries:
    name: Architecture boundaries — module /impl + model-training isolation
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev-phase2-run4') || (github.event_name == 'pull_request' && github.base_ref == 'dev-phase2-run4') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Guard unit tests (positive + negative fixtures per rule)
        run: node --test tools/check_arch_boundaries.test.mjs

      - name: Enforce architecture boundaries over the tracked tree
        run: node tools/check_arch_boundaries.mjs

  secret-scan:
    name: Secret scan & client-surface leak guard
    if: ${{ (github.event_name == 'push' && github.ref == 'refs/heads/dev-phase2-run4') || (github.event_name == 'pull_request' && github.base_ref == 'dev-phase2-run4') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Full history: the history scan must see every commit. A range scan derived from
          # github.event.before fails open three ways (all-zeros on branch creation, a
          # dangling before after a force-push, and hiding a leak commit by force-pushing).
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '26'

      - name: Resolve pinned scanner
        run: |
          set -euo pipefail
          node tools/secret-scan/pin.mjs --github-env "$GITHUB_ENV"

      - name: Install pinned gitleaks (SHA256-verified)
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 --fail --show-error --silent --location \
            --retry 3 --retry-connrefused --max-time 120 \
            --output "$GITLEAKS_HOME/$GITLEAKS_ASSET" "$GITLEAKS_URL"
          printf '%s  %s\n' "$GITLEAKS_SHA256" "$GITLEAKS_ASSET" > "$GITLEAKS_HOME/SHA256SUMS"
          cd "$GITLEAKS_HOME" && sha256sum --check --strict SHA256SUMS
          tar -xzf "$GITLEAKS_HOME/$GITLEAKS_ASSET" -C "$GITLEAKS_HOME" gitleaks
          chmod +x "$GITLEAKS_BIN"
          test -x "$GITLEAKS_BIN"

      - name: Verify scanner identity
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs verify-binary \
            --binary "$GITLEAKS_BIN" --expect-version "$GITLEAKS_VERSION"

      - name: Validate scanner policy and allowlist narrowness
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs policy \
            --config tools/secret-scan/gitleaks.toml \
            --allowlist tools/secret-scan/allowlist.json \
            --emit-ignore "$GITLEAKS_IGNORE_PATH"

      - name: Guard unit tests (reachable-failure-path proof)
        run: node --test tools/secret_scan_guard.test.mjs

      - name: Prove the scanner detects (canary)
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs canary \
            --binary "$GITLEAKS_BIN" \
            --config tools/secret-scan/gitleaks.toml \
            --gitleaks-ignore-path "$GITLEAKS_IGNORE_PATH" \
            --dir "$GITLEAKS_HOME/canary" \
            --report "$GITLEAKS_REPORT_DIR/canary.json"

      - name: Scan working tree at HEAD
        run: |
          set -euo pipefail
          "$GITLEAKS_BIN" dir . \
            --config tools/secret-scan/gitleaks.toml \
            --gitleaks-ignore-path "$GITLEAKS_IGNORE_PATH" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$GITLEAKS_REPORT_DIR/worktree.json" \
            --exit-code 1 \
            --log-level info

      - name: Verify the working-tree scan actually covered the tree
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs verify-report \
            --report "$GITLEAKS_REPORT_DIR/worktree.json" \
            --scope worktree \
            --min-files 500 \
            --sentinel .github/workflows/ci.yml \
            --sentinel AGENTS.md

      - name: Scan full git history
        run: |
          set -euo pipefail
          "$GITLEAKS_BIN" git . \
            --config tools/secret-scan/gitleaks.toml \
            --gitleaks-ignore-path "$GITLEAKS_IGNORE_PATH" \
            --ignore-gitleaks-allow \
            --redact=100 \
            --no-banner \
            --no-color \
            --report-format json \
            --report-path "$GITLEAKS_REPORT_DIR/history.json" \
            --exit-code 1 \
            --log-level info

      - name: Verify the history scan produced a report
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs verify-report \
            --report "$GITLEAKS_REPORT_DIR/history.json" \
            --scope history

      - name: Client-surface leak assertions
        run: |
          set -euo pipefail
          node tools/secret_scan_guard.mjs client-surface \
            --surface-report "$GITLEAKS_REPORT_DIR/surfaces.json"

      - name: Install nao dependencies for local client canary
        working-directory: apps/nao
        run: npm ci

      - name: Build and inspect local Next client canary
        working-directory: apps/nao
        env:
          NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
          NEXT_PUBLIC_SUPABASE_ANON_KEY: synthetic-public-anon
          NEXT_PUBLIC_APP_ENV: ci
          SUPABASE_SERVICE_ROLE_KEY: run4-u1-synthetic-server-canary-178-not-a-secret
        run: |
          set -euo pipefail
          npm run build
          node ../../tools/secret_scan_guard.mjs inspect-client-bundle \
            --dir .next/static --canary "$SUPABASE_SERVICE_ROLE_KEY"

