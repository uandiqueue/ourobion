name: CI

on:
  push:
    branches: [dev-mvp1]
  pull_request:
    branches: [dev-mvp1]

jobs:
  flutter:
    name: Flutter — Analyze & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: src
        run: flutter pub get

      - name: Analyze
        working-directory: src
        run: flutter analyze

      - name: Test
        working-directory: src
        run: flutter test

  typescript:
    name: TypeScript — Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: shared/package-lock.json

      - name: Install dependencies
        working-directory: shared
        run: npm ci

      - name: Type check shared types
        working-directory: shared
        run: npx tsc --noEmit
