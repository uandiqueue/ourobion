name: Brain pipeline (synthesis → verification → edge load)

# R4 / issue #233 §D — the stages AFTER ingestion, run on the cloud compute plane.
#
# `brain-ingest.yml` stops at ingestion, so R2 has never held an `edges/` object and
# hosted `verified_edges` has stayed empty. This workflow closes that gap:
#
#   1. synthesis        WHOLE paper → RelationshipClaim + quote spans  (--push-r2)
#   2. quoteCheck       deterministic, BEFORE any verifier token is spent
#   3. verification     decorrelated adversarial verifier, refute-first, independent
#                       retrieval, defaults to `uncertain`               (--push-r2)
#   4. artifact write   claims + extracted blueprints + verifications to R2
#   5. projection       tools/edge-loader/load_edges.mjs --from-r2 → verified_edges
#
# nao's role is unchanged: it dispatches and reports. It never calls a provider and
# never holds a provider key — the router runs HERE, which is why the LLM keys are
# repository secrets rather than nao env (see docs/nao/brain-ingestion-design.md §8.1).
#
# `operation=full` SPENDS REAL MONEY. `operation=project-only` never reaches a provider:
# it validates an exact hash-pinned R2 bundle and runs only the edge loader. Defaults are
# fail-closed (`dry_run: true`); live provider and DB paths have separate confirmation words.
on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Full provider pipeline or no-spend projection of an exact R2 bundle"
        required: true
        type: choice
        options: [project-only, full]
        default: project-only
      papers:
        description: "Full only: paper uid(s) for post-300 whole-paper synthesis, comma-separated"
        required: false
        type: string
      artifact_revision:
        description: "Full only: artifact revision stamped on every verification"
        required: false
        type: string
      corpus:
        description: "Repo-relative JSONL corpus the verifier retrieves over (blank = EMPTY corpus ⇒ every verdict is uncertain)"
        required: false
        type: string
        default: ""
      dry_run:
        description: "No provider call, no R2 write, no DB write (default)"
        required: false
        type: boolean
        default: true
      confirm_spend:
        description: "Full live only: type RUN to authorise provider calls"
        required: false
        type: string
        default: ""
      confirm_projection:
        description: "Project-only live: type PROJECT to authorise the hosted DB write"
        required: false
        type: string
        default: ""
      expected_claims_sha256:
        description: "Project-only: exact SHA-256 of edges/claims.jsonl"
        required: false
        type: string
        default: ""
      expected_blueprints_sha256:
        description: "Project-only: exact SHA-256 of edges/blueprints.jsonl"
        required: false
        type: string
        default: ""
      expected_verifications_sha256:
        description: "Project-only: exact SHA-256 of edges/verifications.jsonl"
        required: false
        type: string
        default: ""

# Never let publication and projection runs interleave over the shared R2 objects.
concurrency:
  group: brain-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    name: Synthesis → verification → edge load
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: tools/brain-ingest/package-lock.json

      # Fail before any install/spend if the operator asked for a live run without
      # confirming, or asked for one that cannot possibly produce a verdict.
      - name: Gate the run
        env:
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          CONFIRM: ${{ inputs.confirm_spend }}
          CONFIRM_PROJECTION: ${{ inputs.confirm_projection }}
          PAPERS: ${{ inputs.papers }}
          REVISION: ${{ inputs.artifact_revision }}
          CORPUS: ${{ inputs.corpus }}
          CLAIMS_SHA: ${{ inputs.expected_claims_sha256 }}
          BLUEPRINTS_SHA: ${{ inputs.expected_blueprints_sha256 }}
          VERIFICATIONS_SHA: ${{ inputs.expected_verifications_sha256 }}
        run: |
          set -eu
          if [ "$OPERATION" = "project-only" ]; then
            for named in "claims:$CLAIMS_SHA" "blueprints:$BLUEPRINTS_SHA" "verifications:$VERIFICATIONS_SHA"; do
              name=${named%%:*}
              value=${named#*:}
              if ! [[ "$value" =~ ^[0-9a-fA-F]{64}$ ]]; then
                echo "::error::project-only requires an exact 64-hex SHA-256 for $name."
                exit 1
              fi
            done
            if [ "$DRY_RUN" != "true" ] && [ "$CONFIRM_PROJECTION" != "PROJECT" ]; then
              echo "::error::live project-only run requires confirm_projection=PROJECT."
              exit 1
            fi
            echo "Project-only: provider stages are unreachable; exact R2 bundle will be validated."
          else
            if [ -z "${PAPERS:-}" ] || [ -z "${REVISION:-}" ]; then
              echo "::error::full operation requires papers and artifact_revision."
              exit 1
            fi
            if [ "$DRY_RUN" != "true" ]; then
              if [ "$CONFIRM" != "RUN" ]; then
                echo "::error::live full run requires confirm_spend=RUN. Refusing to spend."
                exit 1
              fi
              if [ -z "${CORPUS:-}" ]; then
                echo "::error::live full run needs a corpus; empty retrieval would spend and force uncertain."
                exit 1
              fi
              echo "Live provider run authorised."
            else
              echo "Full dry run: no provider call, no R2 write, no DB write."
            fi
            if [ -n "${CORPUS:-}" ] && [ ! -f "$CORPUS" ]; then
              echo "::error::corpus '$CORPUS' not found in the checkout."
              exit 1
            fi
          fi

      - name: Install dependencies
        run: |
          set -eu
          npm --prefix shared ci || npm --prefix shared install --no-audit --no-fund
          npm --prefix tools/llm-router ci
          npm --prefix tools/brain-ingest ci
          npm --prefix tools/edge-loader ci

      # R2-only commands read tools/brain-ingest/.env. Provider credentials stay
      # out of this file and are exposed only to the two full-operation steps.
      - name: Write R2 .env from secrets
        working-directory: tools/brain-ingest
        run: |
          set -eu
          umask 077
          {
            printf "INGEST_CONTACT_EMAIL=%s\n" "${{ secrets.INGEST_CONTACT_EMAIL }}"
            printf "OPENALEX_API_KEY=%s\n"     "${{ secrets.OPENALEX_API_KEY }}"
            printf "NCBI_API_KEY=%s\n"         "${{ secrets.NCBI_API_KEY }}"
            printf "CORE_API_KEY=%s\n"         "${{ secrets.CORE_API_KEY }}"
            printf "R2_ENDPOINT=%s\n"          "${{ secrets.R2_ENDPOINT }}"
            printf "R2_ACCESS_KEY_ID=%s\n"     "${{ secrets.R2_ACCESS_KEY_ID }}"
            printf "R2_SECRET_ACCESS_KEY=%s\n" "${{ secrets.R2_SECRET_ACCESS_KEY }}"
            printf "R2_BUCKET=%s\n"            "${{ secrets.R2_BUCKET }}"
          } > .env

      # Proves the configured synthesis/verifier models resolve to DIFFERENT vendor
      # families and that every required key is present. The decorrelation invariant is
      # unconditional in config.ts; this surfaces a violation before any token is spent.
      - name: Check router config (decorrelation + keys)
        if: inputs.operation == 'full'
        working-directory: tools/brain-ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
        run: npx tsx src/cli.ts --check-config

      # `synthesize` resolves each paper's citation metadata (title / year / evidence
      # tier) from the LOCAL corpus manifest, not from R2. Ingestion runs in a separate
      # workflow on a different runner, so this runner's cache is always empty and
      # synthesis would fail with "manifest/corpus metadata missing" even though the
      # paper text loads from R2 fine. Hydrate first. No-op if already populated.
      - name: Hydrate local corpus manifest from R2
        if: inputs.operation == 'full'
        working-directory: tools/brain-ingest
        run: npx tsx src/cli.ts hydrate-manifest

      # ── 1 + 2 · synthesis, quoteCheck-gated ────────────────────────────────────
      # The provider keys MUST be in the process environment, not only in .env:
      # LlmRouter resolves keys from `opts.env ?? process.env` (router.ts) and the
      # synthesize/verify paths construct it without an explicit env, so they never
      # read the .env file. Only `live-acceptance` merges .env via loadProtectedEnv.
      # Writing .env alone would fail here with "requires env var OPENAI_API_KEY".
      - name: Synthesis
        if: inputs.operation == 'full'
        working-directory: tools/brain-ingest
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          PAPERS: ${{ inputs.papers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          ARGS=(synthesize-papers --paper "$PAPERS")
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); else ARGS+=(--push-r2); fi
          echo "Running: npx tsx src/cli.ts ${ARGS[*]}"
          npx tsx src/cli.ts "${ARGS[@]}"

      # ── 3 + 4 · decorrelated verification, verdicts published to R2 ─────────────
      - name: Verification
        if: inputs.operation == 'full'
        working-directory: tools/brain-ingest
        env:
          # Same reason as Synthesis: the router reads process.env, not .env.
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          AGNES_API_KEY: ${{ secrets.AGNES_API_KEY }}
          CORPUS: ${{ inputs.corpus }}
          REVISION: ${{ inputs.artifact_revision }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -eu
          ARGS=(verify --artifact-revision "$REVISION")
          if [ -n "${CORPUS:-}" ]; then ARGS+=(--corpus "$GITHUB_WORKSPACE/$CORPUS"); fi
          if [ "$DRY_RUN" = "true" ]; then ARGS+=(--dry-run); else ARGS+=(--push-r2); fi
          echo "Running: npx tsx src/cli.ts ${ARGS[*]}"
          npx tsx src/cli.ts "${ARGS[@]}"

      - name: Validate exact R2 artifact bundle (no providers)
        if: inputs.operation == 'project-only'
        working-directory: tools/brain-ingest
        env:
          CLAIMS_SHA: ${{ inputs.expected_claims_sha256 }}
          BLUEPRINTS_SHA: ${{ inputs.expected_blueprints_sha256 }}
          VERIFICATIONS_SHA: ${{ inputs.expected_verifications_sha256 }}
        run: |
          set -eu
          npx tsx src/cli.ts check-r2-edge-artifacts \
            --claims-sha256 "$CLAIMS_SHA" \
            --blueprints-sha256 "$BLUEPRINTS_SHA" \
            --verifications-sha256 "$VERIFICATIONS_SHA"

      # ── 5 · projection into verified_edges ─────────────────────────────────────
      #
      # The loader connects with `pg` and needs a PostgreSQL connection string. It does
      # NOT use a Supabase API key, so SUPABASE_SECRET_KEYS cannot drive it — see the
      # note on #233. Without SUPABASE_DB_URL this validates the artifacts and stops,
      # rather than silently reporting a projection that never happened.
      - name: Edge load (projection)
        env:
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
          OPERATION: ${{ inputs.operation }}
          DRY_RUN: ${{ inputs.dry_run }}
          OUROBION_EXPECTED_CLAIMS_SHA256: ${{ inputs.expected_claims_sha256 }}
          OUROBION_EXPECTED_VERIFICATIONS_SHA256: ${{ inputs.expected_verifications_sha256 }}
        run: |
          set -eu
          if [ "$OPERATION" = "project-only" ]; then
            ARGS=(--from-r2 --no-prune)
            if [ "$DRY_RUN" = "true" ]; then
              ARGS+=(--check)
              echo "Project-only dry run — exact bundle validation, no database write."
            elif [ -z "${SUPABASE_DB_URL:-}" ]; then
              echo "::error::SUPABASE_DB_URL secret is not set; hosted projection was not attempted."
              exit 1
            fi
            node tools/edge-loader/load_edges.mjs "${ARGS[@]}"
            exit 0
          fi

          if [ "$DRY_RUN" = "true" ]; then
            # A dry run deliberately does not push, so on a bucket that has never had a
            # live run there is legitimately no edges/ object to validate. Treat that one
            # case as the expected empty state — otherwise a dry run could never go green
            # on a fresh bucket and would be worthless as a wiring check. Any OTHER loader
            # failure (bad credentials, malformed artifact) still fails the step.
            echo "Dry run — validating R2 artifacts without touching the database."
            set +e
            OUT=$(node tools/edge-loader/load_edges.mjs --from-r2 --check 2>&1); RC=$?
            set -e
            echo "$OUT"
            if [ $RC -ne 0 ]; then
              if echo "$OUT" | grep -q "claims.jsonl"; then
                echo "::notice::No edges/claims.jsonl in R2 yet — expected before the first live run. R2 credentials and connectivity are proven by this probe."
                exit 0
              fi
              echo "::error::edge-loader validation failed for a reason other than the edges artifact being absent."
              exit $RC
            fi
            exit 0
          fi
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            node tools/edge-loader/load_edges.mjs --from-r2 --check
            echo "::error::SUPABASE_DB_URL secret is not set, so the projection into verified_edges was SKIPPED. Artifacts above are validated and published to R2, but the database was not written. Add a PostgreSQL connection string for the demo project as the SUPABASE_DB_URL repository secret (the loader uses pg, not a Supabase API key, so SUPABASE_SECRET_KEYS cannot substitute)."
            exit 1
          fi
          node tools/edge-loader/load_edges.mjs --from-r2

      - name: Remove secrets file
        if: always()
        run: rm -f tools/brain-ingest/.env
